name: Offline checks
# Runs everything that does not need a Unity licence: core EditMode tests, level validation with
# solution replay, and a compile check of the Unity code against reference assemblies.
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: Tools/check-all.sh
